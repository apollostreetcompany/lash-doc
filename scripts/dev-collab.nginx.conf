server {
    listen 8080;
    access_log off;

    location /auth/v1/ {
        # Resolve inside the Compose network so a restarted Auth container can rejoin.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $auth_upstream auth:9999;
        rewrite ^/auth/v1(/.*)$ $1 break;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host $http_host;
    }

    location /email/ {
        alias /etc/lash-email/;
    }

    location / {
        return 404;
    }
}
