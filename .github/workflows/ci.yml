name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is required for the "Block fresh test.skip / test.todo"
          # diff guard below to resolve `BASE_SHA...HEAD_SHA` locally.
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Block fresh test.skip / test.todo without escape token
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Allow contributors to opt out per-PR with `[allow-skip: <reason>]` in the body.
          if printf '%s' "$PR_BODY" | grep -Eq '\[allow-skip:[^]]+\]'; then
            echo "allow-skip token present in PR body — skipping check."
            exit 0
          fi
          # Make sure both refs are present locally (defense-in-depth for shallow caches).
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          git fetch --no-tags --depth=1 origin "$HEAD_SHA" 2>/dev/null || true
          # Look for newly-added skip/todo invocations in test files. Matches:
          #   test.skip(...), it.skip(...), describe.skip(...), test.skip.each(...)
          #   test.todo(...), it.todo(...)
          # Word-boundary `\b` after .skip prevents false-positives on .skipIf etc.
          DIFF=$(git diff --no-color "$BASE_SHA...$HEAD_SHA" -- '*.spec.ts' '*.spec.tsx' '*.test.ts' '*.test.tsx')
          ADDED=$(printf '%s' "$DIFF" \
            | { grep -E '^\+[^+]' || true; } \
            | { grep -E '\b(test|it|describe)\.skip\b|\b(test|it)\.todo\b' || true; })
          if [ -n "$ADDED" ]; then
            echo "::error::PR adds test.skip / test.todo lines."
            echo "If intentional (e.g. waiting on an upstream lane), add '[allow-skip: <short reason>]' to the PR body."
            echo "$ADDED"
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build
