name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      # Playwright v1.55.1 on Ubuntu Noble. Match the version in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright@sha256:2f29369043d81d6d69a815ceb80760f55e85f5020371ad06a4d996f18503ad1c
      options: --user 1001
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The PR merge commit carries both parents. Keep their ancestry for the diff.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check tracked build outputs
        run: python3 tools/check_generated_files.py --source index

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check new test skips
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/check_test_skips.py

      - name: Lint
        run: pnpm run lint

      - name: Product typecheck
        run: pnpm run typecheck:product

      - name: Harness and evidence typecheck
        run: pnpm run typecheck:harness

      - name: Unit tests
        run: pnpm run test:unit

      - name: E2E tests
        run: pnpm run test:e2e:ci

      - name: Build
        run: pnpm --filter @lash/web build:ci
