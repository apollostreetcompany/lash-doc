name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    # The pinned browser binaries support the Ubuntu 24.04 LTS image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The PR merge commit carries both parents. Keep their ancestry for the diff.
          fetch-depth: 0

      - name: Check tracked build outputs
        run: python3 tools/check_generated_files.py --source index

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check new test skips
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/check_test_skips.py

      - name: Lint
        run: pnpm run lint

      - name: Product typecheck
        run: pnpm run typecheck:product

      - name: Harness and evidence typecheck
        run: pnpm run typecheck:harness

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E tests
        run: pnpm run test:e2e:ci

      - name: Build
        run: pnpm run build:ci
